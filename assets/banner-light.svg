<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Sridharan Periyannan</title>
<desc id="d">Senior Full-Stack Developer: Angular, .NET, microservices and AI/LLM engineering. Animated diagram of a coordinator agent connected to Claude API, MCP tools, RAG, Qdrant, memory and evals.</desc>
<style>

text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
.aur { animation: drift 14s ease-in-out infinite alternate; }
.aur.b { animation-duration: 18s; animation-direction: alternate-reverse; }
@keyframes drift { to { transform: translate(-120px, 40px); } }
.bar { transform-box: fill-box; transform-origin: left; animation: grow .9s cubic-bezier(.2,.8,.2,1) both .2s; }
@keyframes grow { from { transform: scaleX(0); } }
.up { animation: up .8s cubic-bezier(.2,.8,.2,1) both; }
@keyframes up { from { opacity: 0; transform: translateY(14px); } }
.role { opacity: 0; animation: role 9s infinite; }
.role.r0 { opacity: 1; }
.r1 { animation-delay: 3s; } .r2 { animation-delay: 6s; }
@keyframes role { 0% { opacity: 0; transform: translateY(10px); } 4%, 30% { opacity: 1; transform: none; } 34%, 100% { opacity: 0; transform: translateY(-10px); } }
.chip { animation: up .6s ease both; }
.edge { stroke: #0891B2; stroke-opacity: .28; stroke-width: 1.5; }
.pk { fill: none; stroke: #0891B2; stroke-width: 3; stroke-linecap: round; stroke-dashoffset: 10px; animation: flow 2.7s linear infinite; }
@keyframes flow { from { stroke-dashoffset: 10px; } to { stroke-dashoffset: calc(-1 * var(--l)); } }
.ring { fill: none; stroke: #2563EB; transform-box: fill-box; transform-origin: center; animation: ping 2.7s ease-out infinite; }
@keyframes ping { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(2.6); } }
.spin { transform-origin: 960px 160px; animation: spin 12s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tw { fill: #0891B2; animation: tw 4s ease-in-out infinite; }
@keyframes tw { 50% { opacity: .1; } }
.lbl { font-size: 11px; fill: #475569; letter-spacing: .5px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
